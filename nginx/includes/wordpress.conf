# WordPress-specific Nginx configuration
# WordPress subdirectory install: core at /wordpress/, wp-content at /wordpress/wp-content/

# WordPress index handling
index index.php index.html;

# Try to serve file directly, fall back to WordPress
location / {
    try_files $uri $uri/ /index.php?$args;
}

# Deny access to sensitive files
location ~ /\. {
    deny all;
}

location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
}

# Allow access to .well-known directory
location ~ /\.well-known {
    allow all;
}

# Static file caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    log_not_found off;
}

# Robots handling (favicon.ico handled by base nginx config)
location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
}

# XML sitemap handling
location ~ ^/sitemap(-[a-z0-9]+)?\.xml$ {
    try_files $uri /index.php?$args;
}

# Disable XML-RPC for security (now at /wordpress/xmlrpc.php)
location = /wordpress/xmlrpc.php {
    deny all;
}

# WordPress admin area (subdirectory install)
location /wordpress/wp-admin/ {
    try_files $uri $uri/ /wordpress/wp-admin/index.php?$args;
}

location /wordpress/wp-includes/ {
    try_files $uri $uri/ =404;
}

# WordPress core PHP files
location ~ ^/wordpress/.*\.php$ {
    include /etc/nginx/fastcgi.conf;
}

# Uploads directory (wp-content is inside wordpress directory)
location /wordpress/wp-content/uploads/ {
    try_files $uri =404;
}
