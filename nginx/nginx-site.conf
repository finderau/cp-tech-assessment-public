# WordPress Playground - Nginx Configuration

server {
    # Increasing cookies resources from default 10k and 100
    large_client_header_buffers 80 8k;
    client_header_buffer_size 8k;

    listen 80 default_server;
    server_name playground.finder.dev;
    root /var/www/src;

    # Force HTTPS redirect (when behind reverse proxy)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$server_name$request_uri;
    }

    # Include WordPress-specific configuration
    include /etc/nginx/templates/wordpress.conf;

    # PHP-FPM handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi.conf;
    }

    # Status endpoint
    location = /status.php {
        fastcgi_pass php-fpm:9000;
        include /etc/nginx/fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/src/status.php;
    }

    # Logging
    access_log /dev/stdout;
    error_log stderr;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
